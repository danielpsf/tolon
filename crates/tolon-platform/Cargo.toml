[package]
name = "tolon-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tolon-core = { path = "../tolon-core" }
# Parameter type of `raise_above_everything`; Tauri windows implement it, so no `tauri` dependency here.
raw-window-handle = "0.6"
thiserror = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
# F13 / AC13.3: Google refresh tokens in the OS keychain (named in docs/architecture.md). The v1
# feature picks Keychain Services on macOS, Credential Manager on Windows and the Secret Service
# over zbus on Linux (zbus is already in the tree through Tauri).
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Only the AppKit classes used, to keep compile time and the lockfile small.
# NSWorkspace: `frontmostApplication`, the app to give focus back to after a reminder (L-056). libc: the `pid_t`
# methods of NSRunningApplication (`processIdentifier`, `runningApplicationWithProcessIdentifier`); libc is already in the lockfile.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSColor", "NSEvent", "NSRunningApplication", "NSWorkspace", "libc", "NSGraphics", "NSResponder", "NSScreen", "NSText", "NSTextField", "NSControl", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSGeometry", "NSString", "NSValue"] }
# Only SMAppService and its error codes (start at login); default features would also pull objc2-security and block2.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService", "SMErrors"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Same 0.62 that wry and tauri already pull in, so the lockfile gains an edge, not a crate.
# Only the Win32 areas used: monitors (Gdi), DPI (HiDpi), topmost and foreground (WindowsAndMessaging), AttachThreadInput (Threading).
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# AppKit needs the main thread and libtest runs tests on workers, so this test has no harness.
[[test]]
name = "macos_screens"
harness = false

[dev-dependencies]
serde_json = "1"
