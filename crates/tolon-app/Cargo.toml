[package]
name = "tolon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tolon-core = { path = "../tolon-core" }
tolon-store = { path = "../tolon-store" }
tolon-sync = { path = "../tolon-sync" }
tolon-platform = { path = "../tolon-platform" }
tauri = { version = "2", features = [] }
anyhow = "1"
# tauri::generate_context!() expands to serde_json calls; also encodes the stored event payloads.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Same versions as tolon-core: local midnight and the machine's zone.
chrono = "0.4.45"
chrono-tz = "0.10.4"
# Machine IANA zone name for "today"; already in the tree through chrono.
iana-time-zone = "0.1.65"
tracing = "0.1"
# Without a subscriber the warn lines are dropped; stderr only, level info.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Sleep in the refresh loop; a oneshot carries the screen list back from the main thread; `select!` and `Notify` in the scheduler loop. Tauri's async runtime is tokio.
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Blocking error dialog when the database cannot be opened or migrated.
tauri-plugin-dialog = "2"
# The F4.5 fallback: a system notification with Join and Snooze actions when the interrupt cannot take over the screen (AC4.5).
tauri-plugin-notification = "2"
# Opens the join link in the default browser (AC5.3). Used from Rust only, the plugin is not registered and no capability grants it.
tauri-plugin-opener = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# Temp dirs for the store-opening tests; already in the tree through tolon-store.
tempfile = "3.27.0"

[features]
# Set by the Tauri CLI for builds: serve the embedded ui/dist instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]
# E2E only (WebDriver suite): the app may fetch a feed over http from a loopback fixture server.
# Never enable it for a release; see tolon-sync.
e2e-loopback = ["tolon-sync/e2e-loopback"]
