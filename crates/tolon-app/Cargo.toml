[package]
name = "tolon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tolon-core = { path = "../tolon-core" }
tolon-store = { path = "../tolon-store" }
tolon-sync = { path = "../tolon-sync" }
tolon-platform = { path = "../tolon-platform" }
tauri = { version = "2", features = [] }
anyhow = "1"
# tauri::generate_context!() expands to serde_json calls.
serde_json = "1"

[features]
# Set by the Tauri CLI for builds: serve the embedded ui/dist instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]
