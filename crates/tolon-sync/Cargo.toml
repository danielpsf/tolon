[package]
name = "tolon-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# E2E only: allows plain http to loopback hosts (127.0.0.0/8, ::1, localhost) and nothing else. Off by
# default, refused at compile time in release mode, and `cargo xtask check-release-features` keeps it out of release.yml.
e2e-loopback = []

[dependencies]
tolon-core = { path = "../tolon-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
