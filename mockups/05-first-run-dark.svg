<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>05-first-run-dark</title><rect x="0" y="0" width="1280" height="800" rx="0" fill="#121A15" stroke="none" stroke-width="1" /><g transform="translate(96,72) scale(0.15384615384615385)"><path d="M130 36c-52 0-86 42-86 104v52h172v-52c0-62-34-104-86-104z" fill="#7FC48F"/><rect x="30" y="192" width="200" height="22" rx="11" fill="#7FC48F"/><circle cx="130" cy="246" r="18" fill="#A9D8B2"/><path d="M232 96a78 78 0 0 1 0 108M26 96a78 78 0 0 0 0 108" stroke="#A9D8B2" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/></g><text x="96" y="200" font-family="Inter Tight, Inter, sans-serif" font-size="56" font-weight="600" fill="#EDE6D6" text-anchor="start" letter-spacing="-2" >Never miss</text><text x="96" y="258" font-family="Inter Tight, Inter, sans-serif" font-size="56" font-weight="600" fill="#EDE6D6" text-anchor="start" letter-spacing="-2" >a meeting again.</text><text x="96" y="300" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >Tolon watches your calendars and takes over the screen</text><text x="96" y="324" font-family="Inter, sans-serif" font-size="17" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >before a meeting starts. Nothing is sent anywhere.</text><circle cx="112" cy="380" r="16" fill="#7FC48F" stroke="#7FC48F" stroke-width="1.5"/><text x="112" y="385" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#121A15" text-anchor="middle" letter-spacing="0" >1</text><text x="144" y="378" font-family="Inter Tight, Inter, sans-serif" font-size="20" font-weight="600" fill="#EDE6D6" text-anchor="start" letter-spacing="0" >Add a calendar</text><text x="144" y="402" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >Sign in with Google, or paste the private iCal link from any calendar. Read only.</text><circle cx="112" cy="468" r="16" fill="none" stroke="#2A3A30" stroke-width="1.5"/><text x="112" y="473" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9AA89E" text-anchor="middle" letter-spacing="0" >2</text><text x="144" y="466" font-family="Inter Tight, Inter, sans-serif" font-size="20" font-weight="600" fill="#EDE6D6" text-anchor="start" letter-spacing="0" >Pick a lead time</text><text x="144" y="490" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >Two minutes before by default. Add a second alarm at the start if you like.</text><circle cx="112" cy="556" r="16" fill="none" stroke="#2A3A30" stroke-width="1.5"/><text x="112" y="561" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9AA89E" text-anchor="middle" letter-spacing="0" >3</text><text x="144" y="554" font-family="Inter Tight, Inter, sans-serif" font-size="20" font-weight="600" fill="#EDE6D6" text-anchor="start" letter-spacing="0" >Try it</text><text x="144" y="578" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >A test alarm shows you exactly what will happen. Esc snoozes, Enter joins.</text><rect x="96" y="640" width="190" height="48" rx="24.0" fill="#7FC48F" stroke="#7FC48F" stroke-width="1" /><text x="191.0" y="669.4" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#121A15" text-anchor="middle" letter-spacing="0" >Sign in with Google</text><rect x="296" y="640" width="190" height="48" rx="24.0" fill="none" stroke="#2A3A30" stroke-width="1" /><text x="391.0" y="669.4" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#EDE6D6" text-anchor="middle" letter-spacing="0" >Paste an iCal link</text><rect x="496" y="640" width="150" height="48" rx="24.0" fill="none" stroke="none" stroke-width="1" /><text x="571.0" y="669.4" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#9AA89E" text-anchor="middle" letter-spacing="0" >Try a test alarm</text><text x="96" y="724" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >Tolon is open source under Apache 2.0. No account, no telemetry.</text><rect x="760" y="180" width="424" height="265" rx="16" fill="#7FC48F" stroke="none" stroke-width="1" /><text x="784" y="214" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#2A4A33" text-anchor="start" letter-spacing="0" >13:58</text><text x="1160" y="214" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#2A4A33" text-anchor="end" letter-spacing="0" >Starts in 2 minutes</text><text x="784" y="300" font-family="Inter Tight, Inter, sans-serif" font-size="30" font-weight="600" fill="#121A15" text-anchor="start" letter-spacing="-1.2" >Platform weekly sync</text><text x="784" y="326" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#2A4A33" text-anchor="start" letter-spacing="0" >14:00 to 14:45 on Google Meet</text><rect x="784" y="380" width="100" height="36" rx="18.0" fill="#121A15" stroke="#121A15" stroke-width="1" /><text x="834.0" y="402.68" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#A9D8B2" text-anchor="middle" letter-spacing="0" >Join</text><rect x="892" y="380" width="110" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1" /><text x="947.0" y="402.32" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#121A15" text-anchor="middle" letter-spacing="0" >Snooze 5 min</text><rect x="1010" y="380" width="80" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1" /><text x="1050.0" y="402.32" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#121A15" text-anchor="middle" letter-spacing="0" >Dismiss</text><text x="760" y="480" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#9AA89E" text-anchor="start" letter-spacing="0" >Preview of the alarm</text></svg>