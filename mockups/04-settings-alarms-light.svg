<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>04-settings-alarms-light</title><rect x="0" y="0" width="1280" height="800" rx="0" fill="#FBF8F0" stroke="none" stroke-width="1" /><rect x="0" y="0" width="220" height="800" rx="0" fill="#F1EDE0" stroke="none" stroke-width="1" /><g transform="translate(24,24) scale(0.1076923076923077)"><path d="M130 36c-52 0-86 42-86 104v52h172v-52c0-62-34-104-86-104z" fill="#4A7A52"/><rect x="30" y="192" width="200" height="22" rx="11" fill="#4A7A52"/><circle cx="130" cy="246" r="18" fill="#355B3C"/><path d="M232 96a78 78 0 0 1 0 108M26 96a78 78 0 0 0 0 108" stroke="#355B3C" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/></g><text x="60" y="46" font-family="Inter Tight, Inter, sans-serif" font-size="17" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Tolon</text><text x="24" y="100" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6F756F" text-anchor="start" letter-spacing="0" >Calendars</text><rect x="12" y="118" width="196" height="32" rx="8" fill="#EEF3EB" stroke="none" stroke-width="1" /><text x="24" y="140" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Alarms</text><text x="24" y="180" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6F756F" text-anchor="start" letter-spacing="0" >Quiet hours</text><text x="24" y="220" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6F756F" text-anchor="start" letter-spacing="0" >Appearance</text><text x="24" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6F756F" text-anchor="start" letter-spacing="0" >Startup</text><text x="24" y="300" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6F756F" text-anchor="start" letter-spacing="0" >About</text><text x="260" y="84" font-family="Inter Tight, Inter, sans-serif" font-size="44" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="-1.3" >Alarms</text><text x="260" y="112" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#6F756F" text-anchor="start" letter-spacing="0" >When to take over the screen, and what to show.</text><text x="260" y="160" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Take over the screen</text><rect x="260" y="176" width="60" height="44" rx="10" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="290" y="204" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="middle" letter-spacing="0" >2</text><text x="332" y="204" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >minutes before the start, and again at the start if not dismissed</text><text x="260" y="256" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >On which screens</text><rect x="260" y="272" width="470" height="38" rx="19" fill="#F1EDE0" stroke="#E6E0CF" stroke-width="1" /><rect x="263" y="275" width="150" height="32" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1" /><text x="338.0" y="296" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#141A16" text-anchor="middle" letter-spacing="0" >Every screen</text><text x="493.0" y="296" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >The screen with the mouse</text><text x="648.0" y="296" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >Main screen only</text><text x="260" y="352" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Sound</text><rect x="260" y="368" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="276" y="396" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Soft bell, once</text><text x="540" y="396" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#6F756F" text-anchor="end" letter-spacing="0" >⌄</text><rect x="580" y="378" width="40" height="24" rx="12" fill="#4A7A52" stroke="none" stroke-width="1" /><circle cx="608" cy="390" r="9" fill="#FFFFFF"/><text x="630" y="396" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Repeat every 30 s until dismissed</text><text x="260" y="456" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Join button</text><text x="260" y="484" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Tolon finds Google Meet, Zoom, Teams and Webex links in the event, its location and its description.</text><rect x="260" y="506" width="20" height="20" rx="6" fill="#4A7A52" stroke="#4A7A52" stroke-width="1.5" /><path d="M265 516.5l3.5 3.5L275 512.5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Open the link in the browser</text><rect x="260" y="540" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#6F756F" stroke-width="1.5" /><text x="292" y="554" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Open the Zoom or Teams app when installed</text><text x="260" y="610" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#141A16" text-anchor="start" letter-spacing="0" >Keyboard</text><rect x="260" y="626" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="290" y="645" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >Enter</text><text x="330" y="645" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Join</text><rect x="470" y="626" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="500" y="645" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >Esc</text><text x="540" y="645" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Snooze 5 min</text><rect x="680" y="626" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="710" y="645" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >D</text><text x="750" y="645" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >Dismiss</text><rect x="890" y="626" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#E6E0CF" stroke-width="1" /><text x="920" y="645" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#6F756F" text-anchor="middle" letter-spacing="0" >Space</text><text x="960" y="645" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#141A16" text-anchor="start" letter-spacing="0" >I am already there</text><text x="260" y="712" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#6F756F" text-anchor="start" letter-spacing="0" >Changes save as you make them.</text></svg>