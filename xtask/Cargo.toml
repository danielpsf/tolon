[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# anyhow is allowed in xtask (docs/architecture.md); gives error context for command runners.
anyhow = "1"
# serde_json parses `cargo metadata` output as a Value; no derive needed.
serde_json = "1"
