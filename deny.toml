# cargo-deny policy (AGENTS.md hard rule 3: every new dependency passes `cargo deny check`).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "unmaintained, not a vulnerability; transitive via Tauri 2's gtk-rs 0.18 Linux stack; drop when Tauri moves to gtk-rs >= 0.19 or gtk4" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, not a vulnerability; zbus 5 reaches us on Linux through tauri-plugin-notification (notify-rust) and tauri-plugin-opener (L-032); drop when notify-rust moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, not a vulnerability; same zbus 5 path as RUSTSEC-2026-0370" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, not a vulnerability; same zbus 5 path as RUSTSEC-2026-0370" }
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
# Workspace path deps have no version; none of these crates is published to crates.io.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
