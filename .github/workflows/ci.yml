name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux build deps (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      # dtolnay installs rustup where it is missing (act images); the next step then installs
      # exactly what rust-toolchain.toml pins (channel and components), so there is one pin.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      # ui/ lands with L-002; both steps are skipped until ui/package-lock.json exists.
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install ui dependencies
        if: hashFiles('ui/package-lock.json') != ''
        run: npm --prefix ui ci
      - name: Gate
        run: cargo xtask ci
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux'
  # hashFiles() is not allowed in a job-level `if`, so a tiny job reports whether ui/e2e exists.
  changes:
    runs-on: ubuntu-22.04
    outputs:
      e2e: ${{ steps.detect.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "e2e=$([ -d ui/e2e ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  # e2e runs only once L-023 adds ui/e2e (the WebDriver suite); until then the job is skipped.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: [gate, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.os }}
    # Non-blocking until L-027 makes Windows reliable (decisions.md 2026-10-19); failures still show per job.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: on the windows-2025 image WebView2 never opens its debug port under msedgedriver
        # (actions/runner-images#14738), so the session fails with DevToolsActivePort.
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cargo install tauri-driver --locked
      - name: Install msedgedriver matching WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - run: npm --prefix ui ci
      - name: Build debug app
        run: npm --prefix ui run tauri build -- --debug --no-bundle
      - name: Run WebDriver suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix ui run e2e
      - name: Run WebDriver suite (Windows)
        if: runner.os == 'Windows'
        run: npm --prefix ui run e2e
